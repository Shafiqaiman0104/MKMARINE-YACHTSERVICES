<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOUTH WAVE - Order QR</title>
    <script src="https://cdn.jsdelivr.net/npm/pocketbase/dist/pocketbase.umd.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { min-height: 100vh; display: flex; justify-content: center; align-items: center; background: linear-gradient(45deg, #0f2027, #203a43, #2c5364); padding: 20px; }
        .container { width: 100%; max-width: 400px; padding: 40px; background: rgba(255, 255, 255, 0.1); border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.2); color: white; text-align: center; backdrop-filter: blur(10px); }
        h2 { margin-bottom: 20px; font-weight: 300; letter-spacing: 2px; }
        .qr-box { background: white; padding: 20px; border-radius: 12px; display: inline-block; margin: 20px 0; border: 1px solid #00d2ff; }
        .order-id { font-size: 1.2rem; font-weight: bold; color: #00d2ff; margin-bottom: 10px; }
        #loading { opacity: 0.6; font-style: italic; }
    </style>
</head>
<body>
<div class="container" id="content">
    <h2>SOUTH WAVE</h2>
    <img src="/img/logoWhite.png" alt="Logo" style="width: 120px; margin-bottom: 20px;">
    
    <div id="loading">Verifying Order...</div>

    <div id="qr-container" style="display: none;">
        <p style="font-size: 0.9rem; margin-bottom: 5px;">Rental Order QR</p>
        <div class="qr-box" id="qrcode"></div>
        <div class="order-id" id="display-order-id"></div>
        <p style="font-size: 0.85rem; opacity: 0.7;">Please present this QR code to the security guard at the marina entrance gate / staff at the watersports area for processing.</p>
    </div>
</div>

<script>
    const pb = new PocketBase('https://pocketbase.venturerushtech.com');
    pb.autoCancellation(false);

    const params = new URLSearchParams(window.location.search);
    const orderId = params.get('orderId');

    window.onload = async () => {
        if (!orderId) {
            handleInvalid();
            return;
        }

        try {
            // Check if Order ID exists in the database
            const record = await pb.collection('MKMARINE_WATERSPORT_SALES_DATA').getFirstListItem(`orderId="${orderId}"`);
            
            if (record) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('qr-container').style.display = 'block';
                document.getElementById('display-order-id').innerText = orderId;
                
                // Generate the actual QR code for scanning
                const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(orderId)}`;
                document.getElementById('qrcode').innerHTML = `<img src="${qrApiUrl}" alt="Order QR" style="width: 200px; height: 200px; display: block;">`;
            } else {
                handleInvalid();
            }
        } catch (e) {
            console.error("Validation error:", e);
            handleInvalid();
        }
    };

    function handleInvalid() {
        alert("Order Id not valid, please use the correct link provide by staff");
        document.getElementById('content').innerHTML = `
            <h2>SOUTH WAVE</h2>
            <i class="fas fa-exclamation-triangle" style="font-size: 3rem; color: #ff4b2b; margin-bottom: 20px;"></i>
            <h3 style="color: white;">Invalid Link</h3>
            <p style="margin-top: 15px; opacity: 0.8;">Order Id not valid, please use the correct link provide by staff.</p>
        `;
    }
</script>
</body>
</html>
