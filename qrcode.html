<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOUTH WAVE - Order QR</title>
    <script src="pocketbase.umd.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { min-height: 100vh; display: flex; justify-content: center; align-items: center; background: #f0f2f5; padding: 20px; }
        .container { width: 100%; max-width: 400px; padding: 40px; background: #ffffff; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); color: #1a1a1b; text-align: center; }
        h2 { margin-bottom: 20px; font-weight: 700; letter-spacing: 2px; color: #001f3f; }
        .qr-box { background: white; padding: 20px; border-radius: 12px; display: inline-block; margin: 20px 0; border: 2px solid #001f3f; }
        .order-id { font-size: 1.2rem; font-weight: bold; color: #ff6600; margin-bottom: 10px; }
        #loading { color: #666; font-style: italic; }
    </style>
</head>
<body>
<div class="container" id="content">
    <h2>SOUTH WAVE</h2>
    <img src="/img/logoBlue.png" alt="Logo" style="width: 120px; margin-bottom: 20px;">
    
    <div id="loading">Verifying Order...</div>

    <div id="qr-container" style="display: none; color: #333;">
        <p style="font-size: 0.9rem; margin-bottom: 5px; font-weight: 600;">Rental Order QR</p>
        <div class="qr-box" id="qrcode"></div>
        <div class="order-id" id="display-order-id"></div>
        <p style="font-size: 0.85rem; color: #666;">Please present this QR code to the security guard at the marina entrance gate / staff at the watersports area for processing.</p>
    </div>

    <div id="thank-you-container" style="display: none; text-align: left; background: #f8f9fa; padding: 25px; border-radius: 12px; border: 1px solid #eee; color: #333; font-size: 0.95rem; line-height: 1.6; white-space: pre-wrap;">
        <!-- Populated by JS -->
    </div>

    <div style="margin-top: 30px; border-top: 1px solid #eee; padding-top: 15px; font-size: 0.75rem; color: #888;">
        <b><i>Powered By VentureRush Tech</i></b>
    </div>
</div>

<script>
    const pb = new PocketBase('https://pocketbase.venturerushtech.com');
    pb.autoCancellation(false);

    const params = new URLSearchParams(window.location.search);
    const orderId = params.get('orderId');

    async function init() {
        if (!orderId) {
            handleInvalid();
            return;
        }

        try {
            // Check if Order ID exists in the database
            const record = await pb.collection('MKMARINE_WATERSPORT_SALES_DATA').getFirstListItem(`orderId="${orderId}"`);
            
            if (record) {
                document.getElementById('loading').style.display = 'none';

                let allEnded = false;
                if (record.startTime) {
                    const startMs = new Date(record.startTime).getTime();
                    const durs = (record.orderItemRentalDuration || '').split(', ').map(d => parseInt(d) || 0);
                    
                    // Check if every single item in the order has finished its duration
                    allEnded = durs.every(durationMin => {
                        const endTimeMs = record.endTimeEarly ? new Date(record.endTimeEarly).getTime() : (startMs + (durationMin * 60000));
                        return Date.now() > endTimeMs;
                    });
                }

                if (allEnded) {
                    // Hide QR and show Thank You message
                    document.getElementById('qr-container').style.display = 'none';
                    const thankYouBox = document.getElementById('thank-you-container');
                    thankYouBox.style.display = 'block';
                    
                    thankYouBox.innerHTML = 
                        `Thank you so much for choosing South Wave for your watersports adventure! We hope you had an amazing time on the water with us.\n\n` +
                        `If you’d like to share your experience, it would mean the world to us:\n\n` +
                        `⭐ Leave a Google review here: <a href="https://search.google.com/local/writereview?placeid=ChIJJ8jYdLEN2jERIgS8U_6cptc" target="_blank" style="color: #ff6600; text-decoration: underline; word-break: break-all;">https://search.google.com/local/writereview?placeid=ChIJJ8jYdLEN2jERIgS8U_6cptc</a>\n\n` +
                        `📸 Tag us on TikTok @mkyachts\n` +
                        `we’d love to see your best moments!\n\n` +
                        `🌐 Visit Our Website: <a href="https://southwavejb.com" target="_blank" style="color: #ff6600; text-decoration: underline;">https://southwavejb.com</a>\n\n` +
                        `Hope to see you again soon for another adventure! 🤙\n` +
                        `From South Wave Team`;
                } else {
                    // Show QR Code as normal
                    document.getElementById('qr-container').style.display = 'block';
                    document.getElementById('thank-you-container').style.display = 'none';
                    document.getElementById('display-order-id').innerText = orderId;
                    
                    // Generate the actual QR code for scanning
                    const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(orderId)}`;
                    document.getElementById('qrcode').innerHTML = `<img src="${qrApiUrl}" alt="Order QR" style="width: 200px; height: 200px; display: block;">`;
                }
            } else {
                handleInvalid();
            }
        } catch (e) {
            console.error("Validation error:", e);
            handleInvalid();
        }
    }

    if (document.readyState === 'complete' || document.readyState === 'interactive') {
        init();
    } else {
        window.addEventListener('DOMContentLoaded', init);
    }

    function handleInvalid() {
        alert("Order Id not valid, please use the correct link provide by staff");
        document.getElementById('content').innerHTML = `
            <h2 style="color: #001f3f;">SOUTH WAVE</h2>
            <i class="fas fa-exclamation-triangle" style="font-size: 3rem; color: #d93025; margin-bottom: 20px;"></i>
            <h3 style="color: #d93025;">Invalid Link</h3>
            <p style="margin-top: 15px; color: #666;">Order Id not valid, please use the correct link provide by staff.</p>
        `;
    }
</script>
</body>
</html>
