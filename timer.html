<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOUTH WAVE - Rental Timer</title>
    <script src="https://cdn.jsdelivr.net/npm/pocketbase/dist/pocketbase.umd.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { min-height: 100vh; display: flex; justify-content: center; align-items: center; background: #f0f2f5; padding: 20px 0; }
        .container { width: 95%; max-width: 600px; padding: 30px; background: #ffffff; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); color: #1a1a1b; text-align: center; }
        h2 { margin-bottom: 20px; font-weight: 700; letter-spacing: 2px; color: #001f3f; }
        h3 { color: #ff6600; margin-bottom: 20px; font-weight: 600; }
        .table-container { overflow-x: auto; margin-top: 20px; background: #f8f9fa; border-radius: 12px; padding: 10px; border: 1px solid #eee; }
        table { width: 100%; border-collapse: collapse; min-width: 500px; }
        th, td { padding: 12px; border-bottom: 1px solid #eee; font-size: 0.85rem; }
        th { color: #001f3f; text-align: left; font-weight: bold; }
        .timer-val { font-family: monospace; font-weight: bold; color: #ff6600; }
        .timer-end { color: #d93025; }
        .status-msg { margin-top: 20px; color: #666; font-style: italic; }
    </style>
</head>
<body>
<div class="container" id="timer-content">
    <h2 style="color: #001f3f;">SOUTH WAVE</h2>
    <img src="/img/logoBlue.png" alt="Logo" style="width: 120px; margin-bottom: 20px;">
    <h3>Rental Timer</h3>
    <p style="font-size: 0.9rem; margin-bottom: 10px;">Order ID: <span id="display-order-id" style="font-weight: bold; color: #001f3f;"></span></p>
    
    <div id="timer-status" class="status-msg">Loading timer data...</div>
    
    <div class="table-container" id="table-wrapper" style="display: none;">
        <table>
            <thead>
                <tr>
                    <th>Item</th>
                    <th style="text-align: center;">Qty</th>
                    <th style="text-align: center;">Dur</th>
                    <th style="text-align: center;">Start</th>
                    <th style="text-align: center;">End</th>
                    <th style="text-align: center;">Timer</th>
                </tr>
            </thead>
            <tbody id="timer-body"></tbody>
        </table>
    </div>

    <div id="thank-you-container" style="display: none; text-align: left; background: #f8f9fa; padding: 25px; border-radius: 12px; border: 1px solid #eee; color: #333; font-size: 0.95rem; line-height: 1.6; white-space: pre-wrap; margin-top: 20px;">
        <!-- Populated by JS -->
    </div>

    <div style="margin-top: 30px; border-top: 1px solid #eee; padding-top: 15px; font-size: 0.75rem; color: #888;">
        <b><i>Powered By VentureRush Tech</i></b>
    </div>
</div>

<script>
    const pb = new PocketBase('https://pocketbase.venturerushtech.com');
    pb.autoCancellation(false);

    const params = new URLSearchParams(window.location.search);
    const orderId = params.get('orderId');
    let timerInterval = null;

    window.onload = async () => {
        if (!orderId) {
            document.getElementById('timer-content').innerHTML = `
                <h2 style="color: #001f3f;">SOUTH WAVE</h2>
                <i class="fas fa-exclamation-triangle" style="font-size: 3rem; color: #d93025; margin-bottom: 20px;"></i>
                <h3 style="color: #d93025;">Invalid Link</h3>
                <p>Order ID is missing. Please use the link provided by the staff.</p>
            `;
            return;
        }
        document.getElementById('display-order-id').innerText = orderId;

        try {
            const record = await pb.collection('MKMARINE_WATERSPORT_SALES_DATA').getFirstListItem(`orderId="${orderId}"`);
            
            if (!record.startTime) {
                document.getElementById('timer-status').innerText = "Timer hasn't started yet. Please wait for the staff to start your session.";
                return;
            }

            document.getElementById('timer-status').style.display = 'none';
            document.getElementById('table-wrapper').style.display = 'block';

            updateTimers(record);
            timerInterval = setInterval(() => updateTimers(record), 1000);
        } catch (e) {
            console.error("Timer data loading failed", e);
            alert("Order Id not valid, please use the correct link provide by staff");
            document.getElementById('timer-content').innerHTML = `
                <h2 style="color: #001f3f;">SOUTH WAVE</h2>
                <i class="fas fa-exclamation-circle" style="font-size: 3rem; color: #d93025; margin-bottom: 20px;"></i>
                <h3 style="color: #d93025;">Order Not Found</h3>
                <p>The Order ID provided is invalid. Please use the correct link from staff.</p>
            `;
        }
    };

    function updateTimers(record) {
        const names = (record.orderItemName || '').split(', ');
        const qtys = (record.orderItemQuantity || '').split(', ');
        const durs = (record.orderItemRentalDuration || '').split(', ');
        const startMs = new Date(record.startTime).getTime();
        const startStr = new Date(record.startTime).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true }).toUpperCase();

        const body = document.getElementById('timer-body');
        let html = '';
        let allEnded = true;

        names.forEach((name, i) => {
            const durationMin = parseInt(durs[i]) || 0;
            const endTimeMs = startMs + (durationMin * 60000);
            const endStr = new Date(endTimeMs).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true }).toUpperCase();
            const diff = endTimeMs - Date.now();

            if (diff > 0) allEnded = false;

            let timerDisplay = '';
            let timerClass = 'timer-val';

            if (diff <= 0) {
                timerDisplay = 'End';
                timerClass += ' timer-end';
            } else {
                const m = Math.floor(diff / 60000);
                const s = Math.floor((diff % 60000) / 1000);
                timerDisplay = `${m.toString().padStart(2, '0')}m ${s.toString().padStart(2, '0')}s`;
            }

            html += `<tr><td style="text-align: left;">${name}</td><td style="text-align: center;">${qtys[i]}</td><td style="text-align: center;">${durationMin}m</td><td style="text-align: center;">${startStr}</td><td style="text-align: center;">${endStr}</td><td style="text-align: center;" class="${timerClass}">${timerDisplay}</td></tr>`;
        });
        body.innerHTML = html;

        const thankYouBox = document.getElementById('thank-you-container');
        if (allEnded) {
            if (thankYouBox.style.display !== 'block') {
                thankYouBox.style.display = 'block';
                thankYouBox.innerHTML = 
                    `Thank you so much for choosing South Wave for your watersports adventure! We hope you had an amazing time on the water with us.\n\n` +
                    `If you’d like to share your experience, it would mean the world to us:\n\n` +
                    `⭐ Leave a Google review here: <a href="https://search.google.com/local/writereview?placeid=ChIJJ8jYdLEN2jERIgS8U_6cptc" target="_blank" style="color: #ff6600; text-decoration: underline; word-break: break-all;">https://search.google.com/local/writereview?placeid=ChIJJ8jYdLEN2jERIgS8U_6cptc</a>\n\n` +
                    `📸 Tag us on TikTok @mkyachts\n` +
                    `we’d love to see your best moments!\n\n` +
                    `🌐 Visit Our Website: <a href="https://southwavejb.com" target="_blank" style="color: #ff6600; text-decoration: underline;">https://southwavejb.com</a>\n\n` +
                    `Hope to see you again soon for another adventure! 🤙\n` +
                    `From South Wave Team`;
            }
        } else {
            thankYouBox.style.display = 'none';
        }
    }
</script>
</body>
</html>
